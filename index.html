<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kyambogo student portal</title>
    <link rel="stylesheet" href="kyu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>


<body>

<form id="loginForm" action="#" novalidate>

    <img src="IMAGES/2nd logo.png" alt="Kyambogo University Logo">

    <h3>KYAMBOGO UNIVERSITY</h3>
    <h5>ACMIS STUDENTS PORTAL</h5>

    <div class="login-form">
        <h5>LOGIN INTO YOUR ACCOUNT</h5>
        <div><input id="studentNo" type="text" placeholder="reg number or student number" required></div>
        <div><input id="password" type="password" placeholder="password" required></div>

        <label class="remember-me">
            <input type="checkbox">
            <span>Remember me</span>
        </label>

        <div><button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> SIGN IN</button></div>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
    </div>

    <div class="links">
        <a href="forgot-password.html">Forgot Password?</a>
        <a href="login.html">Create account</a>
    </div>
</form>

<script src="script.js"></script>

</body>
</html>
